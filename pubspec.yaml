name: track_expenses
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  animate_do: ^5.1.0
  flutter:
    sdk: flutter
  flutter_gen: ^5.15.0
  flutter_svg: ^2.3.0
  provider: ^6.1.5+1
  animated_flip_counter: ^0.3.4
  sqflite: ^2.4.2+1
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  open_file: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0
  flutter_launcher_icons: ^0.14.4
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/